<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toki - Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #150a0d;
      color: #f5e6e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e1014;
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid #3a1f28;
    }
    header h1 { color: #ffb199; font-size: 20px; }
    header p { color: #b8998f; font-size: 13px; margin-top: 3px; }
    .botoes {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .botoes button {
      background: #2b131a;
      color: #ffb199;
      border: 1px solid #3a1f28;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .botoes button:hover { background: #3a1c24; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 15px;
    }
    .toki {
      background: #2b131a;
      align-self: flex-start;
      border: 1px solid #3a1f28;
    }
    .major {
      background: #3a1c24;
      align-self: flex-end;
      border: 1px solid #c0392b;
    }
    .name {
      font-size: 12px;
      color: #ffb199;
      margin-bottom: 4px;
      font-weight: bold;
    }
    #inputArea {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e1014;
      border-top: 1px solid #3a1f28;
    }
    #input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a1f28;
      background: #2b131a;
      color: #f5e6e0;
      font-size: 15px;
      outline: none;
    }
    #send {
      padding: 12px 18px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    #send:hover { background: #e74c3c; }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b131a;
      color: #ffb199;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #3a1f28;
      display: none;
      z-index: 99;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Toki</h1>
    <p>18 anos • Submissa • Esperando sua ordem</p>
    <div class="botoes">
      <button onclick="gerarPrompt()">📋 Gerar Prompt Explícito</button>
      <button onclick="abrirProjeto()">🔥 Abrir Meu Projeto</button>
    </div>
  </header>

  <div id="chat">
    <div class="msg toki">
      <div class="name">Toki</div>
      Major... eu nunca fiz isso com um homem antes. *olha para você corada*<br>
      Pode me usar do jeito que quiser... eu sou sua putinha agora.
    </div>
  </div>

  <div id="inputArea">
    <input type="text" id="input" placeholder="Digite sua mensagem..." autocomplete="off">
    <button id="send">Enviar</button>
  </div>

  <div class="toast" id="toast">Prompt copiado!</div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const toast = document.getElementById('toast');

    const respostas = [
      "Sim Major... *fica vermelha* pode mandar em mim.",
      "*mexe nas mãos nervosa* Eu... eu quero te agradar.",
      "Pode ser bruto comigo... eu aguento.",
      "*olha para você submissa* O que você quer que eu faça agora?",
      "Minha bucetinha já está molhada só de imaginar...",
      "*morde o lábio* Me usa do jeito que quiser, Major.",
      "Eu sou sua putinha... pode fazer o que quiser comigo.",
      "*geme baixinho* Fala o que eu tenho que fazer...",
      "Major... *abre um pouco as pernas* quer que eu mostre?",
      "Pode me mandar ficar de quatro... eu faço.",
      "*voz baixa e safada* Eu nunca tive um pau dentro de mim ainda...",
      "Me trata que nem puta, Major... eu gosto.",
      "*engole seco* Quero sentir você.",
      "Pode gozar onde quiser em mim...",
      "*olha para você com tesão* Estou toda molhada só de falar com você."
    ];

    const prompts = [
      "Adult 18+. Toki, long blonde hair, blue eyes, slim athletic body, completely naked, detailed medium firm breasts, hard nipples, submissive look, photorealistic explicit, 8k",
      "Adult 18+. Toki, long blonde hair, naked, sitting with legs spread, detailed wet virgin pussy, fingers spreading, shy but aroused expression, photorealistic explicit, 8k",
      "Adult 18+. Toki on all fours, long blonde hair, ass up, detailed round ass, visible anus and wet pussy, looking back submissively, photorealistic explicit, 8k",
      "Adult 18+. Toki, naked, bent over spreading her ass cheeks with both hands, showing virgin pussy and asshole, needy expression, photorealistic explicit, 8k",
      "Adult 18+. Toki on her knees, long blonde hair, looking up submissively, mouth slightly open, small to medium firm breasts visible, photorealistic explicit, 8k",
      "Adult 18+. Toki lying on back, legs wide open, detailed wet virgin pussy, blushing and biting lip, photorealistic explicit, 8k",
      "Adult 18+. Toki, reverse cowgirl position, long blonde hair, detailed ass and pussy visible, looking back, photorealistic explicit hardcore, 8k",
      "Adult 18+. Toki completely naked, standing and presenting her body, hands behind back, submissive pose, detailed breasts and pussy, photorealistic explicit, 8k"
    ];

    function adicionarMensagem(texto, tipo) {
      const div = document.createElement('div');
      div.className = 'msg ' + tipo;
      div.innerHTML = `<div class="name">${tipo === 'toki' ? 'Toki' : 'Major'}</div>${texto}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function responder() {
      const resposta = respostas[Math.floor(Math.random() * respostas.length)];
      setTimeout(() => {
        adicionarMensagem(resposta, 'toki');
      }, 700);
    }

    function enviar() {
      const texto = input.value.trim();
      if (!texto) return;
      adicionarMensagem(texto, 'major');
      input.value = '';
      responder();
    }

    function gerarPrompt() {
      const prompt = prompts[Math.floor(Math.random() * prompts.length)];
      navigator.clipboard.writeText(prompt).then(() => {
        toast.innerText = "Prompt explícito copiado!";
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2200);
      });
    }

    function abrirProjeto() {
      window.open('https://perchance.org/rel4eiwbg9', '_blank');
    }

    sendBtn.addEventListener('click', enviar);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') enviar();
    });
  </script>
</body>
</html>
